name: Android APK

on:
  push:
    branches:
      - coderabbit/middlescroll-hitbox
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GIT_TERMINAL_PROMPT: "0"
      HXCPP_COMPILE_THREADS: "2"
    steps:
      - name: Checkout source and assets
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          sdkmanager --install 'build-tools;35.0.0' 'ndk;29.0.13113456' 'platforms;android-29' 'platforms;android-35'

      - name: Set up Haxe
        uses: funkincrew/ci-haxe@v3.2.7
        with:
          haxe-version: "4.3.7"

      - name: Install Haxe dependencies
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git funkin-patches
          haxelib --never newrepo
          for attempt in 1 2 3; do
            if haxelib --global run hmm install -q; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Haxe dependency installation failed after three attempts." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Test Psych chart importer
        run: bash scripts/test-psych-importer.sh

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxfixes-dev libxss-dev libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - name: Update Lime native submodules
        timeout-minutes: 15
        run: git -C .haxelib/lime/git submodule update --init --recursive

      - name: Build HXCPP tools
        timeout-minutes: 10
        run: haxelib run lime rebuild hxcpp

      - name: Build Lime host libraries
        timeout-minutes: 20
        run: haxelib run lime rebuild cpp -64

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/29.0.13113456"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build Lime Android libraries
        timeout-minutes: 25
        run: haxelib run lime rebuild android

      - name: Compress mobile textures
        timeout-minutes: 40
        run: haxelib run astc-compressor compress-from-json -json ./astc-compression-data.json

      - name: Build APK
        timeout-minutes: 40
        # Release code with Android's local debug signing (no signing secrets required).
        run: >-
          haxelib run lime build android
          -DNO_FEATURE_DEBUG_FUNCTIONS -DNO_FEATURE_DEBUG_DISPLAY
          -DNO_FEATURE_DEBUG_MENU -DNO_FEATURE_RESULTS_DEBUG
          -DNO_FEATURE_FUNKVIS
          -DNO_FEATURE_MOBILE_ADVERTISEMENTS -DNO_FEATURE_MOBILE_IAP
          -DNO_FEATURE_MOBILE_IAR -DNO_FEATURE_MOBILE_AGESIGNALS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flixel-Engine-android
          path: export/release/android/bin/**/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
